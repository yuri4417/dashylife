services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: dashylife-network
